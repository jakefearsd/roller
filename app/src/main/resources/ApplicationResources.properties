# To find unused strings, see MessageKeyTest.reportsBundleKeysNoJspOrControllerUses
# (app/src/test/java/org/apache/roller/weblogger/ui/MessageKeyTest.java)
#
# When to use double-apostrophe for an apostrophe in resource strings? Spring's
# ResourceBundleMessageSource (see messageSource() in boot/WebMvcConfig.java) only
# runs a message through java.text.MessageFormat -- which treats a lone "'" as a
# quoting character -- when the lookup passes arguments (<spring:message
# arguments="...">, addError/addMessage(model, key, param, request), etc). A
# no-argument lookup (<spring:message code="foo"/>, <fmt:message key="foo"/>,
# addError(model, key, request)) is returned verbatim, so doubling the apostrophe
# there renders it literally, twice: "you''ve" on the page instead of "you've".
# Double it ('' for one literal ') ONLY for keys invoked WITH arguments; every
# other key gets a plain '. MessageKeyTest asserts this holds for every key in
# this file.


