# Production stack for Roller: app + postgres + caddy (TLS-terminating
# reverse proxy) + backup (nightly pg_dump + volume snapshots).
#
# First-time setup (see docker_deployment.md for the full runbook):
#   cp deploy/.env.example .env
#   cp deploy/config/roller-production.properties.example \
#      deploy/config/roller-production.properties
#   # edit both: real domain, real DB password (must match in both files),
#   # real SMTP settings
#   docker compose -f docker-compose.prod.yml up -d
#
# Upgrades: see deploy/deploy.sh (Stage 1C Task 3).
#
# This file intentionally does NOT publish the app's own port or the
# postgres port on the host -- caddy is the only public entrypoint (80/443),
# and the app's management port (8090, actuator health) is reached only via
# docker exec / the internal network, never published, per the runtime
# contract (see Dockerfile).

services:

  app:
    # Built by CI and published to GHCR when a v*.*.* tag is pushed, and
    # only then (.github/workflows/release.yml) -- so :latest is the last
    # tagged release, not the last commit on master. An untagged tree is
    # deployed by building locally, not by pulling.
    # ROLLER_IMAGE lets an operator pin a specific version tag; the
    # `build:` section below lets this same file build from the local tree
    # instead (`docker compose -f docker-compose.prod.yml build app`),
    # which is what local verification and deploy.sh's --build flag use.
    image: ${ROLLER_IMAGE:-ghcr.io/jakefearsd/roller:latest}
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JAVA_OPTS: ${JAVA_OPTS:-}
    volumes:
      - ./deploy/config/roller-production.properties:/config/roller-production.properties:ro
      - roller-mediafiles:/data/mediafiles
      - roller-search-index:/data/search-index
      - roller-uploads:/data/uploads
    healthcheck:
      # Runs inside the container, against the management-only port --
      # curl is installed in the runtime image for exactly this (Dockerfile).
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - internal

  postgres:
    # Same digest as the dev stack's postgres service (docker-compose.yml) --
    # same major version discipline, see RollerPostgresContainer.
    image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rollerdb}
      POSTGRES_USER: ${POSTGRES_USER:-roller}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - roller-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roller} -d ${POSTGRES_DB:-rollerdb}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - internal
    # No host port published by default: only the app and backup containers
    # need to reach postgres, and they do so over the internal network. An
    # operator who needs host access for one-off debugging can add a mapping
    # in an override file rather than editing this one.

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    depends_on:
      - app
      - umami
      - listmonk
    ports:
      - "80:80"
      - "443:443"
    environment:
      ROLLER_DOMAIN: ${ROLLER_DOMAIN:?ROLLER_DOMAIN must be set in .env (a real domain, or :80 for LAN/testing)}
      # Hostname for the Umami dashboard. Defaults to a name that cannot
      # resolve publicly, so an operator who has not set one gets a site Caddy
      # never serves rather than an analytics console on their blog's domain.
      UMAMI_DOMAIN: ${UMAMI_DOMAIN:-analytics.invalid}
      # Hostname for the newsletter admin and its opt-in/unsubscribe pages.
      # Same reasoning as UMAMI_DOMAIN: an unset value is a name that cannot
      # resolve, not an admin console on the blog's domain.
      LISTMONK_DOMAIN: ${LISTMONK_DOMAIN:-newsletter.invalid}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      - internal

  # Self-hosted, cookie-free analytics. Shares the postgres instance rather
  # than running a second engine: one database to back up, one to tune, and
  # analytics traffic is trivial next to the blog's. deploy/deploy.sh creates
  # the database if it is missing.
  #
  # ORIGIN MATTERS. Every bundled theme ships a Content-Security-Policy with
  # script-src 'self' and connect-src 'self', so a tracker loaded from another
  # hostname would simply be blocked. Caddy therefore serves the tracker script
  # and the collect endpoint from the BLOG's own origin under /analytics/*
  # (see deploy/caddy/Caddyfile); only the dashboard, which no theme CSP
  # governs, lives on its own hostname. That is what keeps the policy -- pinned
  # byte-for-byte by three rendering tests -- untouched by this feature.
  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-roller}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${UMAMI_DB:-umami}
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET must be set in .env (openssl rand -hex 32)}
      # Caddy terminates TLS and is the only thing that talks to this service,
      # so the client's real address arrives in X-Forwarded-For.
      CLIENT_IP_HEADER: X-Forwarded-For
      DISABLE_TELEMETRY: "1"
      TRACKER_SCRIPT_NAME: ${UMAMI_SCRIPT_NAME:-script.js}
    restart: unless-stopped
    networks:
      - internal
    # No host port: Caddy reaches it over the internal network.

  # Self-hosted newsletter. Like umami it shares the postgres instance in its
  # own database, created by deploy/deploy.sh.
  #
  # Listmonk owns the subscriber list, the double opt-in flow and the sending;
  # Roller stores no subscriber data at all, which keeps a whole class of
  # retention and consent work out of the blog. Its UI and its opt-in and
  # unsubscribe pages live on their own hostname ({$LISTMONK_DOMAIN}), because
  # running listmonk under a sub-path is an open feature request upstream, not
  # a supported configuration.
  #
  # The one thing served from the blog's own origin is the public subscribe
  # API, routed by Caddy -- a subscribe form on a blog page has to reach a
  # same-origin URL or the theme's own connect-src 'self' blocks it.
  listmonk:
    image: listmonk/listmonk:v3
    depends_on:
      postgres:
        condition: service_healthy
    # --install --idempotent creates the schema on a first run and does
    # nothing on later ones, so this is safe on every deploy.
    command: >
      sh -c "./listmonk --install --idempotent --yes --config ''
             && ./listmonk --upgrade --yes --config ''
             && ./listmonk --config ''"
    environment:
      LISTMONK_app__address: "0.0.0.0:9000"
      # Public URL listmonk builds its opt-in and unsubscribe links from.
      # These are followed from an email client, so they are not subject to
      # any theme CSP and can live on listmonk's own hostname.
      LISTMONK_app__root_url: ${LISTMONK_ROOT_URL:-https://newsletter.invalid}
      LISTMONK_db__host: postgres
      LISTMONK_db__port: "5432"
      LISTMONK_db__user: ${POSTGRES_USER:-roller}
      LISTMONK_db__password: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      LISTMONK_db__database: ${LISTMONK_DB:-listmonk}
      LISTMONK_db__ssl_mode: disable
      LISTMONK_ADMIN_USER: ${LISTMONK_ADMIN_USER:-admin}
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_ADMIN_PASSWORD:?LISTMONK_ADMIN_PASSWORD must be set in .env}
    restart: unless-stopped
    networks:
      - internal
    # No host port: Caddy reaches it over the internal network.

  backup:
    # Reuses the postgres image for pg_dump/psql; the loop and single-shot
    # scripts are bind-mounted rather than baked into a custom image, so the
    # backup logic can be edited without a rebuild. See deploy/backup/backup.sh
    # for the RESTORE procedure.
    image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rollerdb}
      POSTGRES_USER: ${POSTGRES_USER:-roller}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGHOST: postgres
      # Dumped alongside the blog database; see deploy/backup/backup.sh.
      UMAMI_DB: ${UMAMI_DB:-umami}
      LISTMONK_DB: ${LISTMONK_DB:-listmonk}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./deploy/backup/backup.sh:/backup.sh:ro
      - ./deploy/backup/loop.sh:/loop.sh:ro
      - roller-backups:/backups
      - roller-mediafiles:/data/mediafiles:ro
      - roller-search-index:/data/search-index:ro
      - roller-uploads:/data/uploads:ro
    entrypoint: ["/loop.sh"]
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:

volumes:
  roller-pgdata:
  roller-mediafiles:
  roller-search-index:
  roller-uploads:
  roller-backups:
  caddy-data:
  caddy-config:
