name: Release

# Fires when a tag matching v*.*.* is pushed. Builds the executable WAR,
# publishes the production image to GHCR as both :<version> and :latest,
# and creates a GitHub Release with the WAR attached.
#
# This is the ONLY thing that publishes an image. `docker-compose.prod.yml`
# defaults the app to ghcr.io/jakefearsd/roller:latest and `deploy/deploy.sh`
# pulls it, so :latest now means "the last tagged release" rather than "the
# last commit anyone pushed". To deploy an untagged tree, deploy.sh --build
# builds from the checkout instead.
#
# To cut a release:
#   1. mvn versions:set -DnewVersion=6.2.0 -DgenerateBackupPoms=false
#      (only if the pom version is changing -- the tag drives the image tag
#      either way)
#   2. Run the browser ITs locally: mvn verify -Pit
#   3. git commit -am "release: 6.2.0"
#   4. git tag v6.2.0 && git push origin master v6.2.0

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write    # create the GitHub Release
  packages: write    # push to ghcr.io

jobs:
  release:
    name: Build, publish image, create release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Project
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: false
          show-progress: false

      - name: Extract version from tag
        id: version
        run: |
          # v6.2.0 -> 6.2.0
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: maven

      # The unit suite already gated the commit this tag points at (main.yml
      # runs it on every push to master), and the browser ITs are a
      # pre-release local step. -DskipTests, not -Dmaven.test.skip: test
      # sources must still compile, so a tag cut from a tree with a broken
      # test source fails here rather than shipping.
      - name: Build the executable WAR
        run: mvn -V -ntp clean package -DskipTests

      # GHCR requires an all-lowercase repository path, but
      # github.repository preserves the owner/repo casing as configured on
      # GitHub, so it may contain uppercase characters. Lowercase it into an
      # env var here rather than assuming the repo name is already lowercase.
      - name: Compute lowercase image repository
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ env.IMAGE_REPO }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Roller ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: app/target/roller.war
          fail_on_unmatched_files: true
