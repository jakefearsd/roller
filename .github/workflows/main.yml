name: Roller

# Two tiers, split by what each costs.
#
# The unit suite is ~3 minutes, so it gates every push -- a regression there
# should never survive the commit that caused it. The browser ITs are ~16
# minutes of Chrome driving a real WAR against a real Postgres, and paying
# that on every push made a red mail arrive for things a re-run fixes (see
# the GalleryIT upload race). They run nightly and on demand instead.
#
# Publishing is NOT here. Pushing to master used to publish
# ghcr.io/jakefearsd/roller:latest, which meant every commit silently became
# the image `deploy/deploy.sh` would pull next. Images now come from a
# release tag only -- see release.yml.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'   # nightly 04:00 UTC -- browser ITs

# A rapid series of pushes should leave one run standing, not a queue of
# runs all testing superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build+Test on Linux/JDK ${{ matrix.java }}
    # The nightly tick exists for the ITs; the unit suite already ran on the
    # commit that produced this tree.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # maven-compiler-plugin is configured with <release>25</release>, so
        # JDK 11, 17, and 21 cannot compile this project at all.
        java: [ '25' ]

    steps:
      - name: Checkout Project
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: false
          show-progress: false
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'
          cache: maven

      - name: Build Roller and run JUnit Tests
        run: mvn -V -ntp install

      - name: Diff coverage gate (90% on changed lines)
        if: matrix.java == '25'
        run: |
          pip install diff_cover
          mvn -ntp -pl app jacoco:report
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          if ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No base commit to diff against; skipping."
            exit 0
          fi
          bin/check-diff-coverage.sh "$BASE"

      - name: Publish JUnit Report
        uses: test-summary/action@v2
        if: always()
        with:
          paths: "app/target/surefire-reports/TEST-*.xml"

      # only on integration and only once in this matrix
      - name: Upload Dev Build on Integration
        if: ${{ (matrix.java == '25') && (github.event_name == 'push') }}
        uses: actions/upload-artifact@v4
        with:
          name: dev-build
          path: ./app/target/roller.war
          retention-days: 90
          if-no-files-found: error

  integration-test:
    name: Browser ITs on Linux/JDK 25
    # Nightly, on a PR, or when asked for from the Actions tab -- but not on
    # every push to master. Run them locally before a release with
    # `mvn verify -Pit`; release.yml does not re-run them.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Project
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: false
          show-progress: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: maven

      # Chrome ships on ubuntu-latest; RollerIT runs it headless.
      - name: Run browser integration tests
        run: mvn -V -ntp verify -Pit

      - name: Publish IT Report
        uses: test-summary/action@v2
        if: always()
        with:
          paths: "it-selenium/target/failsafe-reports/TEST-*.xml"
