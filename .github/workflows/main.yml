name: Apache Roller

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    
jobs:
  build-test:
    name: Build+Test on Linux/JDK ${{ matrix.java }} 
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # maven-compiler-plugin is configured with <release>25</release>, so
        # JDK 11, 17, and 21 cannot compile this project at all.
        java: [ '25' ]

    steps:
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'

      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          show-progress: false
          fetch-depth: 0

      - name: Build Roller and run JUnit Tests
        run: mvn -V -ntp install

      - name: Diff coverage gate (90% on changed lines)
        if: matrix.java == '25'
        run: |
          pip install diff_cover
          mvn -ntp -pl app jacoco:report
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          if ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No base commit to diff against; skipping."
            exit 0
          fi
          bin/check-diff-coverage.sh "$BASE"

      - name: Publish JUnit Report
        uses: test-summary/action@v2
        if: always()
        with:
          paths: "app/target/surefire-reports/TEST-*.xml"

      # only on integration and only once in this matrix
      - name: Upload Dev Build on Integration
        if: ${{ (matrix.java == '25') && (github.event_name == 'push') }}
        uses: actions/upload-artifact@v4
        with:
          name: dev-build
          path: ./app/target/roller.war
          retention-days: 90
          if-no-files-found: error

  integration-test:
    name: Browser ITs on Linux/JDK 25
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          show-progress: false

      # Chrome ships on ubuntu-latest; RollerIT runs it headless.
      - name: Run browser integration tests
        run: mvn -V -ntp verify -Pit

      - name: Publish IT Report
        uses: test-summary/action@v2
        if: always()
        with:
          paths: "it-selenium/target/failsafe-reports/TEST-*.xml"

  publish-image:
    name: Publish production image to GHCR
    needs: [build-test, integration-test]
    # The workflow's own `on.push.branches: [master]` trigger filter (above)
    # already restricts push events to master, so this only re-states the
    # push-vs-pull_request distinction: never publish from a PR build.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          show-progress: false

      # GHCR requires an all-lowercase repository path, but
      # github.repository preserves the owner/repo casing as configured on
      # GitHub, so it may contain uppercase characters. Lowercase it into an
      # env var here rather than assuming the repo name is already lowercase.
      - name: Compute lowercase image repository
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}:latest
            ghcr.io/${{ env.IMAGE_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # This job's first real proof is its first run on the next push to
      # master -- GHCR auth, the lowercasing step, and build-push-action's
      # layer-cache behavior can't be exercised from a local `docker build`.
