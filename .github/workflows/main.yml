name: Apache Roller

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    
jobs:
  build-test:
    name: Build+Test on Linux/JDK ${{ matrix.java }} 
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # maven-compiler-plugin is configured with <release>21</release>, so
        # JDK 11 and 17 cannot compile this project at all.
        java: [ '21', '25' ]

    steps:
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'

      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          show-progress: false

      - name: Build Roller and run JUnit Tests
        run: mvn -V -ntp install

      # The it-selenium module is commented out of the parent pom and its page
      # objects still drive removed features (public registration), so it cannot
      # pass as written. Restore this step -- along with the Xvfb setup it needs
      # -- once those tests are updated and the module is back in the reactor.

      - name: Publish JUnit Report
        uses: test-summary/action@v2
        if: always()
        with:
          paths: "app/target/surefire-reports/TEST-*.xml"

      # only on integration and only once in this matrix
      - name: Upload Dev Build on Integration
        if: ${{ (matrix.java == '21') && (github.event_name == 'push') }}
        uses: actions/upload-artifact@v4
        with:
          name: dev-build
          path: ./app/target/roller.war
          retention-days: 90
          if-no-files-found: error
