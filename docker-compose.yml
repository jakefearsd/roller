# Local development stack for Roller.
#
#   ./roller dev     start postgres, apply migrations, run the app via
#                     spring-boot:run (embedded Tomcat)
#   ./roller db      start postgres only
#
# Bringing up Roller itself in a container is closer to production but loses
# spring-boot:run's fast redeploy and hot theme reload:
#
#   docker compose --profile full up

services:

  postgres:
    # Pinned by digest (postgres:16 at time of pin). Testcontainers uses the
    # same major version — see RollerPostgresContainer.
    image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    ports:
      # 5433 on the host: 5432 is commonly taken by a locally-installed
      # PostgreSQL. Override with ROLLER_DB_PORT if 5433 is busy too.
      - "${ROLLER_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: rollerdb
      POSTGRES_USER: roller
      POSTGRES_PASSWORD: roller
    volumes:
      # Named volume, not a bind mount: dev content survives restarts and
      # `docker compose down`. Use `docker compose down -v` to wipe it.
      - roller-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roller -d rollerdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  roller:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - roller-data:/var/lib/roller/data
    profiles:
      # Not started by default; ./roller dev runs the app via spring-boot:run
      # (embedded Tomcat) instead.
      - full

volumes:
  roller-pgdata:
  roller-data:
